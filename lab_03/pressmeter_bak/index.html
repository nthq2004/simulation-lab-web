<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>压力表工作原理：波登管与膜片式</title>

    <!-- 外部CSS -->
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
</head>

<body>

    <!-- 顶部工具栏 -->
    <div id="toolbar">
        <button id="btnUndo" title="撤销上一步">撤销</button>
        <button id="btnRedo" title="恢复上一步">恢复</button>
        <button id="btnAutoWire" title="自动完成所有接线">自动接线</button>
        <button id="btnStartSys" title="起动系统">起动系统</button>
        <button id="btnFiveStep" title="5点观察输入输出">5点步进</button>        
        <button id="faultBtn" title="选择故障进行设置">故障设置</button>
        <button id="btnReset" title="重置系统">重置系统</button>

        <select id="taskSelect">
        </select>

        <button id="btnShow">自动演示</button>
        <button id="btnStep">单步演示</button>
        <button id="btnTrain">演练</button>
        <button id="btnEval">评估</button>
        <button id="btnInstrument">选择仪表</button>
        <button id="btnViewToggle" title="切换2D/3D视图">3D 视图</button>
        <span style="width:1px;height:24px;background:#555;margin:0 8px;display:inline-block;"></span>

        <select id="scenarioSelect">
            <option value="">选择场景</option>
        </select>
        <button id="btnApplyScenario">应用场景</button>

        <button id="btnAlarmLog" title="报警记录">报警记录</button>
        <button id="btnReplay" title="历史数据回放">历史回放</button>
        <button id="btnReport" title="学员报告">学员报告</button>
        <button id="btnGateway" title="硬件网关配置">硬件网关</button>
    </div>

    <!-- 故障设置弹窗 -->
    <div id="faultModal">
        <div class="modal-content">

            <div class="modal-header">
                故障场景配置
            </div>

            <div id="faultForm" class="modal-body">

            </div>

            <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel">取消</button>
                <button id="applyBtn" class="btn-apply">应用设置</button>
            </div>

        </div>
    </div>

    <!-- 仪表选择菜单 -->
    <div id="instrumentModal">
        <div class="modal-content">

            <div class="modal-header">
                选择要显示的仪表
            </div>

            <div id="instrumentForm" class="modal-body">

            </div>

            <div class="modal-footer">
                <button id="instrumentCancelBtn" class="btn-cancel">关闭</button>
            </div>

        </div>
    </div>

    <!-- 报警记录面板 -->
    <div id="alarmPanel" class="side-panel">
        <div class="side-panel-header">
            <span>报警记录</span>
            <div class="side-panel-actions">
                <button id="alarmAckAllBtn" class="btn-small" title="确认全部">全部确认</button>
                <button id="alarmClearBtn" class="btn-small btn-danger" title="清除所有记录">清除</button>
                <button id="alarmPanelClose" class="btn-close" title="关闭">&times;</button>
            </div>
        </div>
        <div class="side-panel-body" id="alarmList">
            <div class="alarm-empty">暂无报警记录</div>
        </div>
    </div>

    <!-- 硬件网关面板 -->
    <div id="gatewayPanel" class="side-panel" style="display:none;">
        <div class="side-panel-header">
            <span>硬件网关配置</span>
            <div class="side-panel-actions">
                <button id="gatewayPanelClose" class="btn-close" title="关闭">&times;</button>
            </div>
        </div>
        <div class="side-panel-body" id="gatewayPanelBody">
            <!-- 由 GatewayPanel.createPanel() 填充 -->
        </div>
    </div>

    <!-- 学员报告面板 -->
    <div id="reportPanel" class="side-panel" style="width:460px;">
        <div class="side-panel-header">
            <span>学员训练报告</span>
            <div class="side-panel-actions">
                <button id="reportPanelClose" class="btn-close" title="关闭">&times;</button>
            </div>
        </div>
        <div class="side-panel-body" id="reportPanelBody">
            <!-- 由 ReportUI 动态填充 -->
        </div>
    </div>

    <!-- 历史回放面板 -->
    <div id="replayPanel" class="side-panel">
        <div class="side-panel-header">
            <span>历史数据回放</span>
            <div class="side-panel-actions">
                <span id="replayStatus" class="replay-status">已停止</span>
                <button id="replayPanelClose" class="btn-close" title="关闭">&times;</button>
            </div>
        </div>
        <div class="side-panel-body">
            <div class="replay-controls">
                <div class="replay-buttons">
                    <button id="replayPlayBtn" class="btn-replay" title="播放/暂停">&#9654;</button>
                    <button id="replayStopBtn" class="btn-replay" title="停止">&#9632;</button>
                </div>
                <div class="replay-progress-container">
                    <input type="range" id="replayProgress" class="replay-progress" min="0" max="100" value="0">
                    <span id="replayProgressText" class="replay-progress-text">0%</span>
                </div>
                <div class="replay-speed">
                    <label>速度:</label>
                    <select id="replaySpeed">
                        <option value="1">1x</option>
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                    </select>
                </div>
                <div class="replay-info">
                    <span id="replayFrameInfo">帧: 0 / 0</span>
                </div>
            </div>
            <div class="replay-data-source">
                <button id="replayLoadBtn" class="btn-small" title="从数据库加载快照">加载数据</button>
                <button id="replayRecordBtn" class="btn-small" title="开始/停止录制">开始录制</button>
            </div>
        </div>
    </div>

    <!-- Konva容器 -->
    <div id="container"></div>
    <!-- 3D 容器 -->
    <div id="container3d" style="display:none;position:absolute;top:48px;left:0;width:100%;height:calc(100vh - 48px);"></div>

    <!-- 主程序 -->
    <script type = "module" src="/main.js"></script>

</body>
</html>
