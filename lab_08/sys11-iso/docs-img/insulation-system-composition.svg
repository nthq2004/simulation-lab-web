<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a73e8"/>
    </marker>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5f6368"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#188038"/>
    </marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#202124">船舶低压电力系统与绝缘监测装置组成</text>

  <!-- 同步发电机 -->
  <rect x="30" y="70" width="170" height="110" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2.5"/>
  <circle cx="70" cy="110" r="20" fill="none" stroke="#188038" stroke-width="2"/>
  <text x="70" y="116" text-anchor="middle" font-size="14" fill="#188038">G</text>
  <text x="130" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">同步发电机</text>
  <text x="130" y="126" text-anchor="middle" font-size="11" fill="#188038">gen1 · 三相 400V</text>
  <text x="115" y="156" text-anchor="middle" font-size="11" fill="#188038">提供三相交流电源</text>

  <!-- 主开关 -->
  <rect x="245" y="70" width="150" height="110" rx="12" fill="#d2e3fc" stroke="#0b5394" stroke-width="2.5"/>
  <text x="320" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5394">主开关 qf1</text>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="#0b5394">船用空气断路器</text>
  <text x="320" y="146" text-anchor="middle" font-size="11" fill="#0b5394">储能 · 合闸 · 保护</text>

  <!-- 汇流排 -->
  <rect x="440" y="60" width="90" height="130" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="485" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#5f6368">汇流排</text>
  <line x1="455" y1="100" x2="515" y2="100" stroke="#c0392b" stroke-width="3"/>
  <line x1="455" y1="120" x2="515" y2="120" stroke="#d4a017" stroke-width="3"/>
  <line x1="455" y1="140" x2="515" y2="140" stroke="#2471a3" stroke-width="3"/>
  <text x="485" y="176" text-anchor="middle" font-size="10" fill="#5f6368">L1 / L2 / L3</text>

  <!-- 绝缘指示灯 -->
  <rect x="600" y="45" width="180" height="115" rx="12" fill="#fef7e0" stroke="#b26a00" stroke-width="2.5"/>
  <text x="690" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#b26a00">绝缘指示灯（地气灯）</text>
  <text x="690" y="98" text-anchor="middle" font-size="11" fill="#b26a00">insul · 三灯星形接法</text>
  <text x="690" y="118" text-anchor="middle" font-size="11" fill="#b26a00">中性点经试验按钮接地</text>
  <text x="690" y="140" text-anchor="middle" font-size="11" fill="#b26a00">直接目视三相对地绝缘</text>

  <!-- 绝缘监视仪 -->
  <rect x="600" y="190" width="180" height="115" rx="12" fill="#f3e8fd" stroke="#8430ce" stroke-width="2.5"/>
  <text x="690" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#8430ce">绝缘监视仪</text>
  <text x="690" y="243" text-anchor="middle" font-size="11" fill="#8430ce">insulmon · 500V 等级</text>
  <text x="690" y="263" text-anchor="middle" font-size="11" fill="#8430ce">注入低频脉冲测泄漏电流</text>
  <text x="690" y="285" text-anchor="middle" font-size="11" fill="#8430ce">&lt;0.1MΩ 声光报警</text>

  <!-- 配电箱 -->
  <rect x="930" y="45" width="0" height="0"/>
  <rect x="30" y="300" width="150" height="130" rx="12" fill="#d2e3fc" stroke="#0b5394" stroke-width="2.5"/>
  <text x="105" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5394">低压配电箱</text>
  <text x="105" y="354" text-anchor="middle" font-size="11" fill="#0b5394">pdb1</text>
  <text x="105" y="378" text-anchor="middle" font-size="11" fill="#0b5394">三路出线开关</text>
  <text x="105" y="400" text-anchor="middle" font-size="11" fill="#0b5394">sw1 / sw2 / sw3</text>
  <text x="105" y="422" text-anchor="middle" font-size="11" fill="#0b5394">过载 · 短路保护</text>

  <!-- 负载 -->
  <rect x="250" y="300" width="150" height="110" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="325" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">三相感应电机</text>
  <text x="325" y="354" text-anchor="middle" font-size="11" fill="#1a73e8">im01 · 动力负载</text>
  <text x="325" y="378" text-anchor="middle" font-size="11" fill="#1a73e8">绝缘故障高发</text>

  <rect x="430" y="300" width="150" height="110" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="505" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">照明灯具</text>
  <text x="505" y="354" text-anchor="middle" font-size="11" fill="#1a73e8">lamp1~3 · 照明负载</text>
  <text x="505" y="378" text-anchor="middle" font-size="11" fill="#1a73e8">多点分路供电</text>

  <rect x="610" y="300" width="160" height="110" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="690" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">三相可调负载</text>
  <text x="690" y="354" text-anchor="middle" font-size="11" fill="#1a73e8">tload · 星形中性点</text>
  <text x="690" y="378" text-anchor="middle" font-size="11" fill="#1a73e8">模拟用电设备</text>

  <!-- 船体地 -->
  <line x1="485" y1="470" x2="485" y2="520" stroke="#5f6368" stroke-width="3"/>
  <line x1="455" y1="520" x2="515" y2="520" stroke="#5f6368" stroke-width="3"/>
  <line x1="465" y1="532" x2="505" y2="532" stroke="#5f6368" stroke-width="3"/>
  <line x1="476" y1="544" x2="494" y2="544" stroke="#5f6368" stroke-width="3"/>
  <text x="485" y="572" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">船体地（大地参考电位）</text>

  <!-- 连线 -->
  <path d="M200 125 L245 125" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <path d="M395 125 L440 125" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <path d="M530 100 L600 95" fill="none" stroke="#b26a00" stroke-width="2" marker-end="url(#aBlue)"/>
  <path d="M530 130 L600 235" fill="none" stroke="#8430ce" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="548" y="150" font-size="10" fill="#5f6368">L1/L2/L3</text>

  <!-- 汇流排 -> 配电箱 -->
  <path d="M485 190 L485 260 L105 260 L105 300" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="300" y="252" font-size="10" fill="#1a73e8">母线进线 in1~3</text>

  <!-- 配电箱 -> 三路负载 -->
  <path d="M180 340 L250 340" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <path d="M180 365 L430 355" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <path d="M180 390 L610 360" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="200" y="332" font-size="10" fill="#1a73e8">sw1 电机</text>
  <text x="330" y="348" font-size="10" fill="#1a73e8">sw2 照明</text>
  <text x="300" y="392" font-size="10" fill="#1a73e8">sw3 可调负载</text>

  <!-- 绝缘装置接地 -->
  <path d="M640 160 L640 470 L485 470" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M700 305 L700 470" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="660" y="452" font-size="10" fill="#5f6368">接船体地</text>

  <!-- 说明 -->
  <rect x="790" y="190" width="150" height="150" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="865" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">监测对象</text>
  <text x="805" y="242" font-size="10.5" fill="#5f6368">三相电网对船体地</text>
  <text x="805" y="262" font-size="10.5" fill="#5f6368">的绝缘电阻 Rx：</text>
  <text x="805" y="288" font-size="10.5" fill="#c0392b">Rx ≥ 0.1MΩ 正常</text>
  <text x="805" y="308" font-size="10.5" fill="#b26a00">Rx &lt; 0.1MΩ 绝缘低</text>
  <text x="805" y="328" font-size="10.5" fill="#8430ce">Rx = 0 接地（短路）</text>
</svg>
