<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Microsoft YaHei','Arial',sans-serif" font-size="13">
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ===== 电压-时间曲线 ===== -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#1a202c">应急汇流排电压 - 时间曲线（一次完整的失电 - 转电 - 恢复过程）</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="300" x2="950" y2="300" stroke="#4a5568" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="300" stroke="#4a5568" stroke-width="2"/>
  <g fill="#718096" font-size="12" text-anchor="end">
    <text x="84" y="104">400V</text>
    <text x="84" y="204">200V</text>
    <text x="84" y="304">0V</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="100" x2="950" y2="100"/>
    <line x1="90" y1="200" x2="950" y2="200"/>
  </g>

  <!-- 时间刻度 -->
  <g fill="#718096" font-size="12" text-anchor="middle">
    <text x="150" y="320">t₀</text>
    <text x="470" y="320">t₀+18s</text>
    <text x="620" y="320">主电恢复</text>
    <text x="760" y="320">+8s</text>
  </g>

  <!-- 应急汇流排电压：400 → 0 → 400 → 400 -->
  <polyline points="90,100 150,100 150,300 470,300 470,100 950,100"
            fill="none" stroke="#c05621" stroke-width="3.5"/>
  <text x="480" y="92" fill="#c05621" font-size="12">应急发电机供电 400V</text>
  <text x="230" y="286" fill="#c05621" font-size="12">应急汇流排失电（约 18s）</text>

  <!-- 标注 -->
  <line x1="150" y1="70" x2="150" y2="300" stroke="#cbd5e0" stroke-dasharray="5 4"/>
  <line x1="470" y1="70" x2="470" y2="300" stroke="#cbd5e0" stroke-dasharray="5 4"/>
  <text x="620" y="130" fill="#276749" font-size="12">联络开关转正常后由主电网供电</text>

  <!-- ===== 效能指标表 ===== -->
  <text x="30" y="380" font-size="16" font-weight="bold" fill="#1a202c">应急供电效能指标（仿真测试记录）</text>
  <g>
    <rect x="30" y="398" width="940" height="40" fill="#edf2f7" stroke="#a0aec0"/>
    <rect x="30" y="438" width="940" height="38" fill="#ffffff" stroke="#cbd5e0"/>
    <rect x="30" y="476" width="940" height="38" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="30" y="514" width="940" height="38" fill="#ffffff" stroke="#cbd5e0"/>
    <rect x="30" y="552" width="940" height="38" fill="#f7fafc" stroke="#cbd5e0"/>
    <g font-weight="bold" fill="#2d3748">
      <text x="48" y="423">效能指标</text>
      <text x="380" y="423">技术要求</text>
      <text x="640" y="423">仿真实测</text>
      <text x="830" y="423">结论</text>
    </g>
    <g fill="#2d3748">
      <text x="48" y="462">主电失电后联络开关分闸</text>
      <text x="380" y="462">立即断开（防非同期）</text>
      <text x="640" y="462">t₀ 时刻动作</text>
      <text x="830" y="462" fill="#276749">合格</text>

      <text x="48" y="500">应急发电机自动起动</text>
      <text x="380" y="500">≤ 10s</text>
      <text x="640" y="500">约 10s</text>
      <text x="830" y="500" fill="#276749">合格</text>

      <text x="48" y="538">应急主开关自动合闸</text>
      <text x="380" y="538">≤ 18s</text>
      <text x="640" y="538">约 18s</text>
      <text x="830" y="538" fill="#276749">合格</text>

      <text x="48" y="576">应急母线电压 / 频率</text>
      <text x="380" y="576">400V±5% / 50Hz±2%</text>
      <text x="640" y="576">约 400V / 50Hz</text>
      <text x="830" y="576" fill="#276749">合格</text>
    </g>
  </g>
</svg>
