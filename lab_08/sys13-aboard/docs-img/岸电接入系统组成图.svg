<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Microsoft YaHei','Arial',sans-serif" font-size="14">
  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5568"/>
    </marker>
    <marker id="ar1b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c05621"/>
    </marker>
    <marker id="ar1g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2f855a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- 分栏标题 -->
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#2b6cb0">船电侧</text>
  <text x="700" y="34" font-size="16" font-weight="bold" fill="#c05621">岸电侧</text>
  <line x1="40" y1="44" x2="300" y2="44" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="700" y1="44" x2="960" y2="44" stroke="#c05621" stroke-width="2"/>

  <!-- 船电侧 -->
  <g text-anchor="middle">
    <rect x="60" y="70" width="210" height="58" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="165" y="95" font-weight="bold">1# 同步发电机 gen1</text>
    <text x="165" y="116" font-size="12" fill="#4a5568">80kW / 400V / 50Hz</text>

    <rect x="60" y="168" width="210" height="58" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="165" y="193" font-weight="bold">船电主开关 qf1</text>
    <text x="165" y="214" font-size="12" fill="#4a5568">含失压脱扣线圈 uv1/uv2 + 常闭触头</text>

    <rect x="60" y="400" width="210" height="56" rx="8" fill="#f0f5ff" stroke="#5a67d8" stroke-width="2"/>
    <text x="165" y="424" font-weight="bold">发电机组遥控面板 genpanel</text>
    <text x="165" y="444" font-size="12" fill="#4a5568">起动 / 停止 / 合闸 / 分闸 / 调速</text>
  </g>

  <!-- 汇流排 -->
  <rect x="360" y="70" width="26" height="260" rx="5" fill="#f6e05e" stroke="#975a16" stroke-width="2"/>
  <text x="352" y="352" text-anchor="end" font-size="13" font-weight="bold" fill="#744210">汇流排 bus1</text>

  <!-- 负载 -->
  <g text-anchor="middle">
    <rect x="440" y="80" width="170" height="66" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="525" y="108" font-weight="bold">照明负载</text>
    <text x="525" y="130" font-size="12" fill="#4a5568">bl1 / bl2 / bl3（星形接法）</text>
  </g>

  <!-- 岸电侧 -->
  <g text-anchor="middle">
    <rect x="700" y="60" width="260" height="56" rx="8" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
    <text x="830" y="84" font-weight="bold">岸电输入三相电源 shore_in</text>
    <text x="830" y="104" font-size="12" fill="#4a5568">U / V / W / N  220V·50Hz</text>

    <rect x="700" y="140" width="260" height="78" rx="8" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
    <text x="830" y="165" font-weight="bold">岸电箱 shorebox1</text>
    <text x="830" y="186" font-size="12" fill="#4a5568">相序指示灯 · 相序转换开关 · 出口空开</text>
    <text x="830" y="206" font-size="12" fill="#4a5568">液晶：线电压 / 频率</text>

    <rect x="700" y="242" width="260" height="56" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <text x="830" y="266" font-weight="bold">负序继电器 neg1</text>
    <text x="830" y="286" font-size="12" fill="#4a5568">监测输出相序，常闭触点串入互锁回路</text>

    <rect x="700" y="322" width="260" height="56" rx="8" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
    <text x="830" y="346" font-weight="bold">岸电主开关 pdb1</text>
    <text x="830" y="366" font-size="12" fill="#4a5568">含失压脱扣线圈 sw1_uv1/uv2 + 常闭触头</text>
  </g>

  <!-- 主回路连线 -->
  <g stroke="#4a5568" stroke-width="2.2" fill="none" marker-end="url(#ar1)">
    <line x1="165" y1="128" x2="165" y2="166"/>
    <line x1="270" y1="197" x2="358" y2="197"/>
    <line x1="386" y1="110" x2="438" y2="110"/>
  </g>

  <!-- 岸电回路连线 -->
  <g stroke="#c05621" stroke-width="2.4" fill="none" marker-end="url(#ar1b)">
    <line x1="830" y1="116" x2="830" y2="138"/>
    <line x1="830" y1="218" x2="830" y2="240"/>
    <line x1="830" y1="298" x2="830" y2="320"/>
    <line x1="830" y1="378" x2="830" y2="440"/>
    <line x1="830" y1="440" x2="373" y2="440"/>
    <line x1="373" y1="440" x2="373" y2="334"/>
  </g>

  <!-- 控制回路：遥控面板 -> 主开关 -->
  <g stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar1g)">
    <line x1="165" y1="398" x2="165" y2="230"/>
  </g>
  <text x="182" y="320" font-size="12" fill="#2f855a">遥控：起动 / 停止 / 合闸 / 分闸</text>

  <!-- 互锁说明 -->
  <rect x="60" y="486" width="880" height="52" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.8"/>
  <text x="80" y="509" font-size="13" font-weight="bold" fill="#c53030">电气互锁：</text>
  <text x="176" y="509" font-size="12" fill="#9b2c2c">qf1 与 pdb1 的失压脱扣线圈，分别由对方的常闭辅助触头供电。任一台合闸到位即切断对方线圈电源，使其无法合闸——两电源只能有一台供电。</text>
  <text x="80" y="529" font-size="12" fill="#9b2c2c">岸电主开关 pdb1 的失压线圈还串入负序继电器常闭触点：岸电相序异常时自动闭锁，禁止投入。</text>
</svg>
