<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="660" height="600" fill="#ffffff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">图 2  通电延时（JSZ3）与断电延时（JSZ3N）动作时序对比</text>

  <!-- ==================== (a) JSZ3 ==================== -->
  <rect x="30" y="44" width="600" height="252" rx="8" fill="#f7f9fb" stroke="#c8d2dc"/>
  <text x="46" y="68" font-size="13.5" font-weight="bold" fill="#2f6f3f">(a) 通电延时型 JSZ3 —— 得电后延时动作，失电瞬时复位</text>

  <!-- 行标签 -->
  <text x="40" y="144" font-size="12" fill="#2d3436">线圈电压</text>
  <text x="40" y="242" font-size="12" fill="#2d3436">触头 NO</text>

  <!-- 时刻标注（仅编号，说明见底部） -->
  <line x1="170" y1="96" x2="170" y2="248" stroke="#2f6f3f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="350" y1="96" x2="350" y2="248" stroke="#2f6f3f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="450" y1="96" x2="450" y2="248" stroke="#2f6f3f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="170" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f3f">①</text>
  <text x="350" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f3f">②</text>
  <text x="450" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f3f">③</text>

  <!-- 线圈波形：low 120-170, high 170-450, low 450-620 -->
  <line x1="120" y1="140" x2="620" y2="140" stroke="#dfe6ec" stroke-width="1"/>
  <polyline points="120,138 170,138 170,112 450,112 450,138 620,138"
    fill="none" stroke="#1a6fb5" stroke-width="2.6"/>
  <text x="310" y="104" text-anchor="middle" font-size="11.5" fill="#1a6fb5">线圈得电（220V）</text>

  <!-- 触头 NO 波形：断开(低) 直到 350 闭合(高) 到 450，然后复位 -->
  <line x1="120" y1="238" x2="620" y2="238" stroke="#dfe6ec" stroke-width="1"/>
  <polyline points="120,236 350,236 350,210 450,210 450,236 620,236"
    fill="none" stroke="#d04020" stroke-width="2.6"/>
  <text x="230" y="262" text-anchor="middle" font-size="11.5" fill="#888">NO 断开（NC 闭合）</text>
  <text x="400" y="200" text-anchor="middle" font-size="11.5" fill="#d04020">NO 闭合</text>

  <!-- 图例 -->
  <text x="46" y="284" font-size="11.5" fill="#2f6f3f">① 得电开始计时　　② 延时 t 到达 → 触头动作　　③ 失电瞬时复位</text>

  <!-- ==================== (b) JSZ3N ==================== -->
  <rect x="30" y="312" width="600" height="252" rx="8" fill="#fdf6f4" stroke="#e2c8c0"/>
  <text x="46" y="336" font-size="13.5" font-weight="bold" fill="#b0361f">(b) 断电延时型 JSZ3N —— 得电瞬时动作，失电后延时复位</text>

  <text x="40" y="412" font-size="12" fill="#2d3436">线圈电压</text>
  <text x="40" y="510" font-size="12" fill="#2d3436">触头 NO</text>

  <!-- 时刻标注 -->
  <line x1="170" y1="364" x2="170" y2="516" stroke="#b0361f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="420" y1="364" x2="420" y2="516" stroke="#b0361f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="580" y1="364" x2="580" y2="516" stroke="#b0361f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="170" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#b0361f">①</text>
  <text x="420" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#b0361f">②</text>
  <text x="580" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#b0361f">③</text>

  <!-- 线圈波形：low 120-170, high 170-420, low 420-620 -->
  <line x1="120" y1="408" x2="620" y2="408" stroke="#dfe6ec" stroke-width="1"/>
  <polyline points="120,406 170,406 170,380 420,380 420,406 620,406"
    fill="none" stroke="#1a6fb5" stroke-width="2.6"/>
  <text x="295" y="372" text-anchor="middle" font-size="11.5" fill="#1a6fb5">线圈得电</text>

  <!-- 触头 NO：得电瞬时闭合 170-580，然后复位 -->
  <line x1="120" y1="506" x2="620" y2="506" stroke="#dfe6ec" stroke-width="1"/>
  <polyline points="120,504 170,504 170,478 580,478 580,504 620,504"
    fill="none" stroke="#d04020" stroke-width="2.6"/>
  <text x="140" y="530" text-anchor="middle" font-size="11.5" fill="#888">NC</text>
  <text x="375" y="468" text-anchor="middle" font-size="11.5" fill="#d04020">NO 闭合并保持</text>
  <text x="600" y="530" text-anchor="middle" font-size="11.5" fill="#888">复位</text>

  <!-- 图例 -->
  <text x="46" y="552" font-size="11.5" fill="#b0361f">① 得电瞬时动作　　② 失电，进入断电延时保持　　③ 延时 t 结束 → 复位</text>

  <text x="330" y="588" text-anchor="middle" font-size="11.5" fill="#888">JSZ3 的延时发生在“得电之后”，JSZ3N 的延时发生在“失电之后”，二者时序正好相反</text>
</svg>
