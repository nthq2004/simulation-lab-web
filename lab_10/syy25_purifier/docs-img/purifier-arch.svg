  <text x="460" y="508" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#78909c" text-anchor="middle">单向数据流：操作只调用模型公开方法；画面只读取 m，绝不直接改物理量</text>
