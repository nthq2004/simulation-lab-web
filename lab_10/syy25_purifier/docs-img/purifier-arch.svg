  <text x="461" y="270" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="normal" fill="#ef6c00" text-anchor="middle">读 m</text>
  <text x="640" y="258" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="normal" fill="#6a1b9a" text-anchor="middle">读 m</text>
  <polyline points="75,292 75,206 236,206" fill="none" stroke="#c62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <polygon points="236,206 226,201 226,211" fill="#c62828"/>
  <text x="84" y="232" font-family="Microsoft YaHei, Arial" font-size="10.5" font-weight="normal" fill="#c62828" text-anchor="start">点击 → s.setValve() / s.pressStart() …</text>
  <polyline points="165,388 240,424" fill="none" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
