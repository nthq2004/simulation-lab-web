  <text x="165" y="360" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#1565c0" text-anchor="middle">LCD 分屏只读渲染</text>
  <rect x="336" y="292" width="250" height="92" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.8"/>
  <text x="461" y="318" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#e65100" text-anchor="middle">EPC60SystemMimic（模拟图）</text>
  <text x="461" y="340" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#ef6c00" text-anchor="middle">_syncVisuals 派生动画</text>
  <text x="461" y="360" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#ef6c00" text-anchor="middle">水量 / 油层 / 底盘 / 流向</text>
  <rect x="632" y="292" width="250" height="92" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8"/>
  <text x="757" y="318" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#4a148c" text-anchor="middle">PurifierSystem / Local（页 2）</text>
  <text x="757" y="340" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#6a1b9a" text-anchor="middle">P&amp;ID 流程 + 机旁控制箱</text>
  <text x="757" y="360" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#6a1b9a" text-anchor="middle">同一 m 的另一套视图</text>
  <rect x="240" y="428" width="440" height="56" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="1.6"/>
