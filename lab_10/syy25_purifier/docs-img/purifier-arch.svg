<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <rect width="920" height="520" fill="#f7f9f8"/>
  <text x="460" y="32" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238" text-anchor="middle">仿真程序的三层结构与数据流</text>
  <rect x="240" y="56" width="440" height="46" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
  <text x="460" y="84" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">ControlSystem（consys.js） 20 fps 物理循环</text>
  <rect x="240" y="140" width="440" height="92" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="460" y="168" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">PurifierSolver（模型层）</text>
  <text x="460" y="192" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle">m：状态机 / 阀门 / 转速 / 温度 / 压力 / 报警 / 参数</text>
  <text x="460" y="214" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle">solve(1/20)：物理量 → 程序引擎 → 报警评估</text>
  <rect x="40" y="292" width="250" height="92" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8"/>
  <text x="165" y="318" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#0d47a1" text-anchor="middle">EPC60Panel（面板）</text>
