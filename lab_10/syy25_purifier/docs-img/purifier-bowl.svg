<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500">
  <rect width="780" height="500" fill="#f7f9f8"/>
  <text x="390" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">S 型分离筒半剖示意</text>

  <!-- frame -->
  <rect x="250" y="400" width="280" height="28" rx="4" fill="#546e7a" stroke="#37474f" stroke-width="2"/>
  <rect x="280" y="428" width="220" height="14" fill="#455a64"/>

  <!-- bowl outer -->
  <circle cx="390" cy="230" r="150" fill="#cfd8dc" stroke="#546e7a" stroke-width="4"/>
  <circle cx="390" cy="230" r="132" fill="#eceff1" stroke="#78909c" stroke-width="2"/>

  <!-- disc stack -->
  <g stroke="#90a4ae" stroke-width="2">
    <line x1="292" y1="180" x2="488" y2="180"/><line x1="286" y1="194" x2="494" y2="194"/>
    <line x1="282" y1="208" x2="498" y2="208"/><line x1="280" y1="222" x2="500" y2="222"/>
    <line x1="280" y1="236" x2="500" y2="236"/><line x1="282" y1="250" x2="498" y2="250"/>
    <line x1="286" y1="264" x2="494" y2="264"/><line x1="292" y1="278" x2="488" y2="278"/>
  </g>
  <line x1="390" y1="150" x2="390" y2="320" stroke="#607d8b" stroke-width="4"/>

  <!-- spindle -->
  <rect x="382" y="300" width="16" height="120" fill="#90a4ae" stroke="#546e7a" stroke-width="1.5"/>

  <!-- paring tube -->
  <rect x="382" y="92" width="16" height="74" fill="#ffb74d" stroke="#ef6c00" stroke-width="1.5"/>
  <circle cx="390" cy="86" r="16" fill="#ffcc80" stroke="#ef6c00" stroke-width="1.5"/>
  <path d="M406 86 H520" stroke="#c48b2c" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- water seal -->
  <path d="M270 230 A120 120 0 0 1 510 230" fill="none" stroke="#4fc3f7" stroke-width="10" opacity="0.8"/>

  <!-- sludge layer -->
  <path d="M272 252 A118 118 0 0 1 508 252" fill="none" stroke="#8d6e63" stroke-width="12" opacity="0.8"/>

  <!-- discharge slide -->
  <rect x="310" y="360" width="160" height="14" rx="3" fill="#78909c" stroke="#455a64" stroke-width="1.5"/>

  <!-- sludge ports -->
  <rect x="330" y="374" width="34" height="10" fill="#5d4037"/>
  <rect x="416" y="374" width="34" height="10" fill="#5d4037"/>

  <!-- water channels -->
  <path d="M360 374 V330 L390 310" fill="none" stroke="#4fc3f7" stroke-width="5"/>
  <path d="M420 374 V330 L390 310" fill="none" stroke="#4fc3f7" stroke-width="5"/>
  <text x="350" y="392" font-family="Microsoft YaHei, Arial" font-size="10" fill="#0277bd">开启/关闭水通道</text>

  <!-- labels -->
  <g font-family="Microsoft YaHei, Arial" font-size="11" fill="#263238">
    <line x1="390" y1="86" x2="620" y2="86" stroke="#78909c" stroke-dasharray="4 3"/><text x="626" y="90">向心泵/向心盘（净油出口）</text>
    <line x1="500" y1="230" x2="630" y2="230" stroke="#78909c" stroke-dasharray="4 3"/><text x="636" y="226">水封腔</text><text x="636" y="242" font-size="10" fill="#0277bd">SV10 建立</text>
    <line x1="508" y1="258" x2="630" y2="258" stroke="#78909c" stroke-dasharray="4 3"/><text x="636" y="262">渣层（排渣口周边）</text>
    <line x1="390" y1="186" x2="170" y2="160" stroke="#78909c" stroke-dasharray="4 3"/><text x="20" y="156">分离盘组</text><text x="20" y="172" font-size="10" fill="#78909c">碟片间隙内完成油水渣分离</text>
    <line x1="390" y1="368" x2="180" y2="368" stroke="#78909c" stroke-dasharray="4 3"/><text x="18" y="364">滑动底盘/排渣口</text><text x="18" y="380" font-size="10" fill="#78909c">SV15 开启水使底盘下移排渣</text>
    <line x1="390" y1="420" x2="590" y2="430" stroke="#78909c" stroke-dasharray="4 3"/><text x="596" y="434">立轴/机架</text>
  </g>

  <text x="390" y="478" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#78909c">S 型取消重力环，靠 ALCAP 水分传感器与向心泵自动适应油品；CentriShoot 排渣盘弹性变形打开排渣口。</text>
</svg>
