<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect width="880" height="470" fill="#f7f9f8"/>
  <text x="440" y="28" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238">常见故障排查流程</text>

  <!-- left: discharge fail -->
  <rect x="30" y="55" width="260" height="380" rx="8" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
  <text x="160" y="82" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#e65100">排渣失败</text>
  <g font-family="Microsoft YaHei, Arial" font-size="10" fill="#263238">
    <rect x="50" y="100" width="220" height="30" rx="4" fill="#fff" stroke="#fb8c00"/><text x="160" y="120" text-anchor="middle">EPC 发出排渣指令</text>
    <rect x="50" y="146" width="220" height="30" rx="4" fill="#fff" stroke="#fb8c00"/><text x="160" y="166" text-anchor="middle">SV15 开启水是否流动？</text>
    <rect x="50" y="192" width="220" height="30" rx="4" fill="#fff" stroke="#fb8c00"/><text x="160" y="212" text-anchor="middle">工作水压力 &gt; 2 bar？</text>
    <rect x="50" y="238" width="220" height="30" rx="4" fill="#fff" stroke="#fb8c00"/><text x="160" y="258" text-anchor="middle">排渣口反馈 / PT4 下降？</text>
    <rect x="50" y="292" width="220" height="54" rx="4" fill="#ffebee" stroke="#e53935"/><text x="160" y="312" text-anchor="middle">重试一次；仍失败 → A04</text><text x="160" y="330" text-anchor="middle">报警并执行 STOP</text>
    <text x="50" y="372" font-size="9" fill="#78909c">检查：工作水滤器、SV15 流量、</text>
    <text x="50" y="386" font-size="9" fill="#78909c">排渣口是否堵塞、滑环密封。</text>
  </g>
  <g stroke="#fb8c00" stroke-width="1.5" marker-end="url(#a2)">
    <line x1="160" y1="130" x2="160" y2="144"/><line x1="160" y1="176" x2="160" y2="190"/><line x1="160" y1="222" x2="160" y2="236"/><line x1="160" y1="268" x2="160" y2="290"/>
  </g>

  <!-- middle: leak -->
  <rect x="310" y="55" width="260" height="380" rx="8" fill="#efebe9" stroke="#6d4c41" stroke-width="2"/>
  <text x="440" y="82" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#4e342e">跑油 / 密封失效</text>
  <g font-family="Microsoft YaHei, Arial" font-size="10" fill="#263238">
    <rect x="330" y="100" width="220" height="30" rx="4" fill="#fff" stroke="#6d4c41"/><text x="440" y="120" text-anchor="middle">PT4 净油压力骤降</text>
    <rect x="330" y="146" width="220" height="30" rx="4" fill="#fff" stroke="#6d4c41"/><text x="440" y="166" text-anchor="middle">分离筒是否关闭/水封？</text>
    <rect x="330" y="192" width="220" height="30" rx="4" fill="#fff" stroke="#6d4c41"/><text x="440" y="212" text-anchor="middle">SV16 关闭水是否正常？</text>
    <rect x="330" y="238" width="220" height="30" rx="4" fill="#fff" stroke="#6d4c41"/><text x="440" y="258" text-anchor="middle">工作水压力是否足够？</text>
    <rect x="330" y="292" width="220" height="54" rx="4" fill="#ffebee" stroke="#e53935"/><text x="440" y="312" text-anchor="middle">A03 OIL LEAKING</text><text x="440" y="330" text-anchor="middle">关 V1、停进油、停机</text>
    <text x="330" y="372" font-size="9" fill="#78909c">检查：滑环/矩形密封圈、阀塞、</text>
    <text x="330" y="386" font-size="9" fill="#78909c">关闭水通道、SV16 与滤器。</text>
  </g>
  <g stroke="#6d4c41" stroke-width="1.5" marker-end="url(#a2)">
    <line x1="440" y1="130" x2="440" y2="144"/><line x1="440" y1="176" x2="440" y2="190"/><line x1="440" y1="222" x2="440" y2="236"/><line x1="440" y1="268" x2="440" y2="290"/>
  </g>

  <!-- right: vibration -->
  <rect x="590" y="55" width="260" height="380" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="720" y="82" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#37474f">振动高</text>
  <g font-family="Microsoft YaHei, Arial" font-size="10" fill="#263238">
    <rect x="610" y="100" width="220" height="30" rx="4" fill="#fff" stroke="#607d8b"/><text x="720" y="120" text-anchor="middle">振动 &gt; 4.5 / 7.1 mm/s</text>
    <rect x="610" y="146" width="220" height="30" rx="4" fill="#fff" stroke="#607d8b"/><text x="720" y="166" text-anchor="middle">分离筒渣层是否不均？</text>
    <rect x="610" y="192" width="220" height="30" rx="4" fill="#fff" stroke="#607d8b"/><text x="720" y="212" text-anchor="middle">分离盘组装配是否正确？</text>
    <rect x="610" y="238" width="220" height="30" rx="4" fill="#fff" stroke="#607d8b"/><text x="720" y="258" text-anchor="middle">轴承/立轴是否磨损？</text>
    <rect x="610" y="292" width="220" height="54" rx="4" fill="#ffebee" stroke="#e53935"/><text x="720" y="312" text-anchor="middle">A01 HIGH VIBRATION</text><text x="720" y="330" text-anchor="middle">停电机、停加热、停进油</text>
    <text x="610" y="372" font-size="9" fill="#78909c">处理：清洗分离筒、重新装配、</text>
    <text x="610" y="386" font-size="9" fill="#78909c">更换轴承/立轴，故障排除后复位。</text>
  </g>
  <g stroke="#607d8b" stroke-width="1.5" marker-end="url(#a2)">
    <line x1="720" y1="130" x2="720" y2="144"/><line x1="720" y1="176" x2="720" y2="190"/><line x1="720" y1="222" x2="720" y2="236"/><line x1="720" y1="268" x2="720" y2="290"/>
  </g>

  <text x="440" y="456" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#78909c">原则：先查原因、再复位；禁止在故障未排除时反复复位或强行起动。</text>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#78909c"/>
    </marker>
  </defs>
</svg>
