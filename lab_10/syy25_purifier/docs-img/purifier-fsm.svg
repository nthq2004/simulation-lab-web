<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580">
  <rect width="920" height="580" fill="#f7f9f8"/>
  <text x="460" y="32" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#263238" text-anchor="middle">工作程序状态机：phase 1～6 与 state 的对应关系</text>
  <rect x="40" y="140" width="240" height="84" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="174" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#1565c0" text-anchor="middle">阶段一  起动准备</text>
  <text x="160" y="198" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#455a64" text-anchor="middle">phase 1  →  STARTING</text>
  <text x="160" y="216" font-family="Microsoft YaHei, Arial" font-size="1" font-weight="normal" fill="#ffffff" text-anchor="middle"></text>
  <rect x="340" y="140" width="240" height="84" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="460" y="174" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#2e7d32" text-anchor="middle">阶段二  起动程序</text>
  <text x="460" y="198" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#455a64" text-anchor="middle">phase 2  →  START_SEQ</text>
  <text x="460" y="216" font-family="Microsoft YaHei, Arial" font-size="1" font-weight="normal" fill="#ffffff" text-anchor="middle"></text>
  <rect x="640" y="140" width="240" height="84" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
  <text x="760" y="174" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#ef6c00" text-anchor="middle">阶段三  正常分油</text>
  <text x="760" y="198" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#455a64" text-anchor="middle">phase 3  →  SEPARATION</text>
  <text x="760" y="216" font-family="Microsoft YaHei, Arial" font-size="1" font-weight="normal" fill="#ffffff" text-anchor="middle"></text>
  <rect x="640" y="330" width="240" height="84" rx="8" fill="#fbe9e7" stroke="#c62828" stroke-width="2"/>
  <text x="760" y="364" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#c62828" text-anchor="middle">阶段四  排渣</text>
  <text x="760" y="388" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#455a64" text-anchor="middle">phase 4  →  DISCHARGE</text>
  <text x="760" y="406" font-family="Microsoft YaHei, Arial" font-size="1" font-weight="normal" fill="#ffffff" text-anchor="middle"></text>
  <rect x="340" y="330" width="240" height="84" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="460" y="364" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#6a1b9a" text-anchor="middle">阶段五  停机置换</text>
  <text x="460" y="388" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#455a64" text-anchor="middle">phase 5  →  STOPPING</text>
  <text x="460" y="406" font-family="Microsoft YaHei, Arial" font-size="1" font-weight="normal" fill="#ffffff" text-anchor="middle"></text>
  <rect x="40" y="330" width="240" height="84" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="160" y="364" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="bold" fill="#37474f" text-anchor="middle">阶段六  自动停机</text>
  <text x="160" y="388" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#455a64" text-anchor="middle">phase 6  →  STOPPING</text>
  <text x="160" y="406" font-family="Microsoft YaHei, Arial" font-size="1" font-weight="normal" fill="#ffffff" text-anchor="middle"></text>
  <polyline points="280,182 338,182" fill="none" stroke="#546e7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="338,182 327,176.5 327,187.5" fill="#546e7a"/>
  <text x="309" y="172" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#78909c" text-anchor="middle">Ti55</text>
  <polyline points="580,182 638,182" fill="none" stroke="#546e7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="638,182 627,176.5 627,187.5" fill="#546e7a"/>
  <text x="609" y="172" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#78909c" text-anchor="middle">Ti63</text>
  <polyline points="760,224 760,328" fill="none" stroke="#c62828" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="760,328 765.5,317 754.5,317" fill="#c62828"/>
  <text x="750" y="252" font-family="Microsoft YaHei, Arial" font-size="9.5" font-weight="normal" fill="#c62828" text-anchor="end">Ti68 到时 / 手动排渣 / 按 O</text>
  <polyline points="720,328 720,226" fill="none" stroke="#ef6c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <polygon points="720,226 715,236 725,236" fill="#ef6c00"/>
  <text x="712" y="282" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#ef6c00" text-anchor="end">Ti75 结束后回分油</text>
  <polyline points="638,372 582,372" fill="none" stroke="#546e7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="582,372 593,377.5 593,366.5" fill="#546e7a"/>
  <text x="609" y="356" font-family="Microsoft YaHei, Arial" font-size="9.5" font-weight="normal" fill="#78909c" text-anchor="middle">停止请求</text>
  <polyline points="338,372 282,372" fill="none" stroke="#546e7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="282,372 293,377.5 293,366.5" fill="#546e7a"/>
  <text x="310" y="362" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#78909c" text-anchor="middle">Ti83</text>
  <rect x="40" y="460" width="240" height="54" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <text x="160" y="486" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="bold" fill="#263238" text-anchor="middle">STANDSTILL（prog = false）</text>
  <text x="160" y="504" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#78909c" text-anchor="middle">Ti89 到时 → _endProgram</text>
  <polyline points="160,416 160,458" fill="none" stroke="#37474f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="160,458 165.5,447 154.5,447" fill="#37474f"/>
  <polyline points="284,486 896,486 896,182 884,182" fill="none" stroke="#1565c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <polygon points="884,182 894,187 894,177" fill="#1565c0"/>
  <text x="590" y="478" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="normal" fill="#1565c0" text-anchor="middle">再次按「I」→ _startProgram(1)</text>
  <text x="40" y="108" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#78909c" text-anchor="start">阶段一/二由「I」键步进起动；阶段四既可周期触发，也可手动触发；阶段五/六由「O」键触发</text>
  <text x="40" y="556" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#78909c" text-anchor="start">每个阶段内部用 step 索引 + Ti 定时器推进；_nextStep() 前进一步，_enterPhase(n) 跨阶段</text>
</svg>
