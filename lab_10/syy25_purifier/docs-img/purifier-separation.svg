  <text x="250" y="522" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="normal" fill="#78909c" text-anchor="middle">分离筒剖面：重相（水、渣）向外，轻相（净油）向内、向上</text>
  <rect x="470" y="96" width="410" height="356" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="675" y="122" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">碟片间隙中的分离过程（放大）</text>
  <polygon points="510,296 840,204 840,218 510,310" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>
  <polygon points="510,364 840,272 840,286 510,378" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>
