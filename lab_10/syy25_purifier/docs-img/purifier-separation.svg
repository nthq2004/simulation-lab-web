  <text x="432" y="264" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="start">出水 → V5</text>
  <polyline points="290,250 426,190" fill="none" stroke="#78909c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="432" y="186" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#263238" text-anchor="start">碟片组（锥角约 40°）</text>
  <polyline points="154,380 100,408" fill="none" stroke="#6d4c41" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
