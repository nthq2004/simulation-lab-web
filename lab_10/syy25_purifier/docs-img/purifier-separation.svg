  <polygon points="510,338 840,246 840,258 510,350" fill="#6d4c41" stroke="none" stroke-width="0" opacity="0.5"/>
  <text x="680" y="248" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#8d5a12" text-anchor="middle">轻相：净油 → 向内、向上</text>
  <text x="680" y="292" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#0d47a1" text-anchor="middle">重相：水 → 向外、向下</text>
  <text x="680" y="332" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="bold" fill="#4e342e" text-anchor="middle">固相：渣 → 贴下碟片向外甩出</text>
  <polyline points="530,396 770,332" fill="none" stroke="#c05600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="770,332 757.954,329.52 760.789,340.149" fill="#c05600"/>
  <text x="534" y="412" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#c05600" text-anchor="start">油从外侧进入间隙</text>
  <polyline points="590,216 510,180" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="510,180 517.774,189.53 522.288,179.498" fill="#2e7d32"/>
  <text x="598" y="212" font-family="Microsoft YaHei, Arial" font-size="11" font-weight="normal" fill="#2e7d32" text-anchor="start">净油向心</text>
  <rect x="40" y="470" width="820" height="54" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="60" y="492" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="start">分离因数 Fr = ω²r/g ≈ 7×10³～8×10³（10680 r/min）；碟片把沉降距离压到 0.5～1 mm，</text>
  <text x="60" y="512" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="start">同一油滴的沉降速度比自然重力沉降提高成千上万倍，因此能在筒内短短数秒内完成油、水、渣的分层。</text>
</svg>
