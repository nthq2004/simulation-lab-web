    .pipeY{fill:none;stroke:#e5a900;stroke-width:9;stroke-linejoin:round}
    .metal{fill:url(#steel);stroke:#202a31;stroke-width:4}
    .thin{fill:none;stroke:#24313a;stroke-width:3}
    .label{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:27px;fill:#071b2d}
    .small{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#09264a}
