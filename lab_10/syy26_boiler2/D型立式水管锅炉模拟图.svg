<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#777f87"/><stop offset=".22" stop-color="#eef3f6"/><stop offset=".55" stop-color="#9ca6ae"/><stop offset=".82" stop-color="#f5f7f8"/><stop offset="1" stop-color="#68727b"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55d8ff"/><stop offset="1" stop-color="#007acb"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff34c"/><stop offset=".5" stop-color="#ff8a00"/><stop offset="1" stop-color="#d92700"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff8270"/><stop offset=".5" stop-color="#e51e0d"/><stop offset="1" stop-color="#9f1008"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  <marker id="arrBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0879dc"/></marker>
  <marker id="arrRed" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e52216"/></marker>
  <marker id="arrYellow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e9a900"/></marker>
