<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="980" height="420" fill="#ffffff"/>
  <text x="16" y="26" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="bold" fill="#1b3a4b">图 3  自动起动时序（预扫风 36 s → 点火位置 3 s → 点火准备 5 s → 点火 3 s → 小火稳定 20 s → 负荷）</text>

  <!-- 时间轴 -->
  <line x1="150" y1="352" x2="950" y2="352" stroke="#37474f" stroke-width="1.5"/>
  <g font-family="Microsoft YaHei" font-size="10.5" fill="#607d8b">
    <text x="150" y="370" text-anchor="middle">0</text>
    <text x="330" y="370" text-anchor="middle">36</text>
    <text x="378" y="370" text-anchor="middle">39</text>
    <text x="450" y="370" text-anchor="middle">44</text>
    <text x="498" y="370" text-anchor="middle">47</text>
    <text x="660" y="370" text-anchor="middle">67</text>
    <text x="900" y="370" text-anchor="middle">t / s</text>
  </g>

  <!-- 阶段色带 -->
  <g>
    <rect x="150" y="44" width="180" height="26" fill="#bbdefb" stroke="#64b5f6"/>
    <text x="240" y="62" font-family="Microsoft YaHei" font-size="11.5" fill="#0d47a1" text-anchor="middle">预扫风 36 s（T101）</text>
    <rect x="330" y="44" width="48" height="26" fill="#c8e6c9" stroke="#81c784"/>
    <text x="354" y="62" font-family="Microsoft YaHei" font-size="10" fill="#1b5e20" text-anchor="middle">位置 3s</text>
    <rect x="378" y="44" width="72" height="26" fill="#fff9c4" stroke="#fdd835"/>
    <text x="414" y="62" font-family="Microsoft YaHei" font-size="10" fill="#827717" text-anchor="middle">准备 5s</text>
    <rect x="450" y="44" width="48" height="26" fill="#ffe0b2" stroke="#ffb74d"/>
    <text x="474" y="62" font-family="Microsoft YaHei" font-size="10" fill="#e65100" text-anchor="middle">点火 3s</text>
    <rect x="498" y="44" width="162" height="26" fill="#d7ccc8" stroke="#a1887f"/>
    <text x="579" y="62" font-family="Microsoft YaHei" font-size="11" fill="#4e342e" text-anchor="middle">小火稳定 20 s（T103）</text>
    <rect x="660" y="44" width="240" height="26" fill="#c8e6c9" stroke="#66bb6a"/>
    <text x="780" y="62" font-family="Microsoft YaHei" font-size="11.5" fill="#1b5e20" text-anchor="middle">负荷控制（小火/大火运行）</text>
  </g>

  <!-- 信号行 -->
  <g font-family="Microsoft YaHei" font-size="11" fill="#37474f">
    <text x="140" y="112" text-anchor="end">Q0.4 风机</text>
    <text x="140" y="152" text-anchor="end">Q1.4 风门衔铁</text>
    <text x="140" y="192" text-anchor="end">Q0.5 油泵</text>
    <text x="140" y="232" text-anchor="end">Q1.1 点火变压器</text>
    <text x="140" y="272" text-anchor="end">Q1.2 / Q1.3 进油阀</text>
    <text x="140" y="312" text-anchor="end">Q2.2 大火（2# 阀）</text>
  </g>

  <g stroke-width="0">
    <!-- 风机：全程 -->
    <rect x="150" y="100" width="750" height="16" fill="#4fc3f7"/>
    <!-- 风门衔铁：36s 起，到 67s 后（大火/停炉）断 -->
    <rect x="330" y="140" width="380" height="16" fill="#ffb300"/>
    <!-- 油泵：36s 起全程 -->
    <rect x="330" y="180" width="570" height="16" fill="#8d6e63"/>
    <!-- 点火变压器：准备段 + 点火段 -->
    <rect x="378" y="220" width="72" height="16" fill="#ff7043"/>
    <rect x="450" y="220" width="48" height="16" fill="#ff7043"/>
    <!-- 进油阀：点火段起 -->
    <rect x="450" y="260" width="450" height="16" fill="#66bb6a"/>
    <!-- 大火：67s 后 -->
    <rect x="660" y="300" width="240" height="16" fill="#43a047"/>
  </g>

  <g stroke="#b0bec5" stroke-width="1" stroke-dasharray="3,3">
    <line x1="330" y1="70" x2="330" y2="352"/>
    <line x1="450" y1="70" x2="450" y2="352"/>
    <line x1="498" y1="70" x2="498" y2="352"/>
    <line x1="660" y1="70" x2="660" y2="352"/>
  </g>

  <text x="330" y="392" font-family="Microsoft YaHei" font-size="10.5" fill="#c62828">M0.3 预扫风结束</text>
  <text x="450" y="392" font-family="Microsoft YaHei" font-size="10.5" fill="#c62828">M3.1 点火准备结束（开始喷油）</text>
  <text x="560" y="392" font-family="Microsoft YaHei" font-size="10.5" fill="#c62828">M0.4 点火结束</text>
  <text x="760" y="392" font-family="Microsoft YaHei" font-size="10.5" fill="#c62828">M0.5 小火稳定结束</text>
</svg>
