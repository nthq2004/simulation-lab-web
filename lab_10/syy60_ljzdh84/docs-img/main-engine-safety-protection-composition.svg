<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2430">主推进装置安全保护系统组成</text>

  <!-- 左：检测信号 -->
  <rect x="24" y="56" width="214" height="330" rx="10" fill="#f3f7fb" stroke="#4a7ab5" stroke-width="2"/>
  <text x="131" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c4a7e">检测信号（传感器）</text>
  <g font-size="13" fill="#20303c">
    <rect x="42" y="96" width="178" height="34" rx="5" fill="#fff" stroke="#9fb4c9"/><text x="131" y="118" text-anchor="middle">双测速单元 / 超速开关</text>
    <rect x="42" y="140" width="178" height="34" rx="5" fill="#fff" stroke="#9fb4c9"/><text x="131" y="162" text-anchor="middle">滑油低压继电器 YT1226</text>
    <rect x="42" y="184" width="178" height="34" rx="5" fill="#fff" stroke="#9fb4c9"/><text x="131" y="206" text-anchor="middle">滑油进口温度（TIC-101）</text>
    <rect x="42" y="228" width="178" height="34" rx="5" fill="#fff" stroke="#9fb4c9"/><text x="131" y="250" text-anchor="middle">缸套冷却水压力 / 温度</text>
    <rect x="42" y="272" width="178" height="34" rx="5" fill="#fff" stroke="#9fb4c9"/><text x="131" y="294" text-anchor="middle">推力瓦、曲轴箱油雾…</text>
    <rect x="42" y="316" width="178" height="34" rx="5" fill="#fff" stroke="#9fb4c9"/><text x="131" y="338" text-anchor="middle">应急停车按钮（不可越控）</text>
  </g>

  <!-- 中：安全单元 -->
  <rect x="300" y="56" width="240" height="150" rx="10" fill="#eef6ee" stroke="#2e8b3d" stroke-width="2"/>
  <text x="420" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c5c28">主机安全单元 ESU</text>
  <text x="314" y="112" font-size="13" fill="#20303c">· 超速保护（转速开关 1/2 冗余）</text>
  <text x="314" y="136" font-size="13" fill="#20303c">· 不可越控停车项目</text>
  <text x="314" y="160" font-size="13" fill="#20303c">· 越控（Cancel）与复位（Reset）</text>
  <text x="314" y="184" font-size="13" fill="#20303c">· 动作后锁存，需人工复位</text>

  <rect x="300" y="226" width="240" height="160" rx="10" fill="#fdf3e8" stroke="#c47a1c" stroke-width="2"/>
  <text x="420" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a4d05">报警系统 K-Chief 600</text>
  <text x="314" y="280" font-size="13" fill="#20303c">· 测点报警与 6 s 安保延时</text>
  <text x="314" y="304" font-size="13" fill="#20303c">· 未确认 / 已确认 / 恢复正常</text>
  <text x="314" y="328" font-size="13" fill="#20303c">· A 级报警驱动 SHD / SLD</text>
  <text x="314" y="352" font-size="13" fill="#20303c">· 越控记录、报警历史</text>

  <!-- 右：执行 -->
  <rect x="616" y="56" width="332" height="150" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="782" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c2418">自动停车 SHUT DOWN（保护优先）</text>
  <g font-size="13" fill="#20303c">
    <text x="632" y="112">1. 燃油切断电磁阀失电 → 断油</text>
    <text x="632" y="136">2. 主起动阀保持关闭，禁止起动</text>
    <text x="632" y="160">3. 状态条 Eng. Not Ready，Start Blocked</text>
    <text x="632" y="184">4. 报警栏 SHUTDN，车钟回 STOP 后复位</text>
  </g>

  <rect x="616" y="226" width="332" height="160" rx="10" fill="#eef3fd" stroke="#2b5cb8" stroke-width="2"/>
  <text x="782" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1c3f86">自动减速 SLOW DOWN（先降速）</text>
  <g font-size="13" fill="#20303c">
    <text x="632" y="280">1. 调速器给定 SETP 被压到 40 rpm</text>
    <text x="632" y="304">2. 按 3 rpm/s 减速度限制降速</text>
    <text x="632" y="328">3. 限制名显示 Slow Down</text>
    <text x="632" y="352">4. 车令降到 40 rpm 以下才解锁</text>
  </g>

  <!-- 连线 -->
  <g stroke="#5b6a78" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M238 150 L296 130"/>
    <path d="M238 240 L296 290"/>
    <path d="M540 130 L612 118"/>
    <path d="M540 300 L612 300"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5b6a78"/>
    </marker>
  </defs>

  <!-- 底部：操作站 -->
  <rect x="24" y="394" width="924" height="66" rx="10" fill="#1f2a33" stroke="#101820" stroke-width="2"/>
  <text x="486" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#8bd0ff">AC 600 操作站（驾控台 / 集控台）Safety System 菜单</text>
  <text x="486" y="438" text-anchor="middle" font-size="12.5" fill="#cfd8e2">Shut Down（自动停车项目）· Slow Down（自动减速项目）· Emg. Stop · RPM Detector</text>
  <text x="486" y="455" text-anchor="middle" font-size="12.5" fill="#cfd8e2">面板左侧 Cancel SHD / Cancel SLD 为总越控，底部消音按钮与 ACK 为声响与报警确认</text>
</svg>
