<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2430">主机滑油低压保护实验：压力继电器 → 自动停车</text>

  <!-- 信号链 -->
  <g font-size="13">
    <rect x="24" y="60" width="164" height="70" rx="8" fill="#f3f7fb" stroke="#4a7ab5" stroke-width="2"/>
    <text x="106" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c4a7e">压力源</text>
    <text x="106" y="108" text-anchor="middle" fill="#20303c">滑油滤器出口</text>
    <text x="106" y="124" text-anchor="middle" fill="#20303c">或 手摇泵</text>

    <rect x="212" y="60" width="164" height="70" rx="8" fill="#f3f7fb" stroke="#4a7ab5" stroke-width="2"/>
    <text x="294" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c4a7e">三通取压阀</text>
    <text x="294" y="108" text-anchor="middle" fill="#20303c">line = 管路</text>
    <text x="294" y="124" text-anchor="middle" fill="#20303c">pump = 手摇泵</text>

    <rect x="400" y="60" width="184" height="70" rx="8" fill="#eef6ee" stroke="#2e8b3d" stroke-width="2"/>
    <text x="492" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1c5c28">压力继电器</text>
    <text x="492" y="108" text-anchor="middle" fill="#20303c">YT1226 · NC 触点</text>
    <text x="492" y="124" text-anchor="middle" fill="#20303c">下限 0.15 / 上限 0.20 MPa</text>

    <rect x="608" y="60" width="150" height="70" rx="8" fill="#fdf3e8" stroke="#c47a1c" stroke-width="2"/>
    <text x="683" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a4d05">K-Chief 测点</text>
    <text x="683" y="108" text-anchor="middle" fill="#20303c">ME-LO-PR-SW</text>
    <text x="683" y="124" text-anchor="middle" fill="#20303c">A 级 · 延时 6 s</text>

    <rect x="782" y="60" width="154" height="70" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
    <text x="859" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c2418">自动停车 SHD</text>
    <text x="859" y="108" text-anchor="middle" fill="#20303c">燃油切断 · 停车</text>
    <text x="859" y="124" text-anchor="middle" fill="#20303c">MAIN L.O. LOW-LOW</text>
  </g>
  <g stroke="#5b6a78" stroke-width="2" fill="none" marker-end="url(#ar3)">
    <path d="M188 95 L208 95"/>
    <path d="M376 95 L396 95"/>
    <path d="M584 95 L604 95"/>
    <path d="M758 95 L778 95"/>
  </g>
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5b6a78"/>
    </marker>
  </defs>

  <!-- 迟滞图 -->
  <text x="40" y="182" font-size="14" font-weight="bold" fill="#1a2430">触点动作特性（迟滞 / 回差）</text>
  <g stroke="#20303c" stroke-width="1.6" fill="none">
    <path d="M110 430 L110 200"/>
    <path d="M110 430 L680 430"/>
  </g>
  <text x="70" y="212" font-size="12" fill="#20303c">压力</text>
  <text x="150" y="210" font-size="12" fill="#20303c">MPa</text>
  <text x="640" y="452" font-size="12" fill="#20303c">时间</text>

  <!-- 网格与标尺 -->
  <g stroke="#dbe3ea" stroke-width="1">
    <path d="M110 388 L680 388"/>
    <path d="M110 330 L680 330"/>
    <path d="M110 260 L680 260"/>
  </g>
  <g font-size="12" fill="#20303c">
    <text x="76" y="392" text-anchor="end">0.15</text>
    <text x="76" y="334" text-anchor="end">0.20</text>
    <text x="76" y="264" text-anchor="end">0.30</text>
  </g>

  <!-- 压力曲线：0.30 下降 → 0.14（触点闭合）→ 回升 0.21（触点断开） -->
  <path d="M130 258 L230 258 L330 392 L420 392 L520 326 L600 326 L660 258"
        fill="none" stroke="#2b5cb8" stroke-width="3"/>
  <g font-size="12" font-weight="bold" fill="#8c2418">
    <text x="336" y="412" text-anchor="middle">0.14 MPa</text>
    <text x="336" y="428" text-anchor="middle" font-size="11.5">触点闭合 → 报警</text>
    <text x="540" y="316" text-anchor="middle">0.21 MPa</text>
    <text x="540" y="304" text-anchor="middle" font-size="11.5">触点断开 → 复位</text>
  </g>
  <g stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4">
    <path d="M110 388 L680 388"/>
    <path d="M110 330 L680 330"/>
  </g>
  <text x="150" y="376" font-size="11.5" fill="#8c2418">下限（动作）</text>
  <text x="150" y="322" font-size="11.5" fill="#8c2418">上限（复位）</text>
  <rect x="330" y="332" width="270" height="56" fill="#c0392b" opacity="0.10"/>
  <text x="465" y="352" text-anchor="middle" font-size="11.5" fill="#8c2418">报警保持区（0.15～0.20）</text>

  <!-- 说明 -->
  <rect x="40" y="462" width="896" height="46" rx="8" fill="#f4f7fa" stroke="#9fb4c9" stroke-width="1.5"/>
  <text x="60" y="482" font-size="12.5" fill="#20303c">给定值螺钉改变下限（30 % → 0.15 MPa），幅差螺钉改变上限（30 % → 0.20 MPa）；</text>
  <text x="60" y="500" font-size="12.5" fill="#20303c">触点闭合后须持续 6 s 才执行自动停车，期间压力回升到上限以上则撤销计时、报警转恢复正常。</text>
</svg>
