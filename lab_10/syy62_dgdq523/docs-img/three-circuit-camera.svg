<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="aC" markerWidth="9" markerHeight="9" refX="7" refY="2.6" orient="auto">
      <path d="M0,0 L7,2.6 L0,5.2 Z" fill="#34495e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="580" fill="#fbfcfe"/>

  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0e6655">图 4 · 视角操作原理（OrbitControls：环绕 target 的球坐标）</text>
  <text x="24" y="58" font-size="13" fill="#7f8c8d">相机由 three.js 官方 OrbitControls 驱动，本质是球坐标 (r, θ, φ)；渲染按需进行（脏标记 + requestAnimationFrame）。</text>

  <!-- 桌面 -->
  <rect x="130" y="430" width="340" height="18" rx="3" fill="#e8d3b3" stroke="#a9743f" stroke-width="2"/>
  <text x="300" y="466" font-size="11.5" fill="#a9743f" text-anchor="middle">实验桌</text>

  <!-- 轨道椭圆 -->
  <ellipse cx="300" cy="300" rx="175" ry="100" fill="none" stroke="#b0bec5" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="300" y="160" font-size="11.5" fill="#5d6d7e" text-anchor="middle">左键拖动 = rotate（绕 target 环视 / 俯仰）</text>

  <!-- 视轴与相机 -->
  <line x1="300" y1="300" x2="398" y2="222" stroke="#34495e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="300" cy="300" r="6" fill="#c0392b"/>
  <text x="300" y="326" font-size="11" fill="#c0392b" text-anchor="middle">target (0, 0.85, 0)</text>

  <rect x="390" y="214" width="20" height="15" rx="2" fill="#2c3e50"/>
  <text x="402" y="206" font-size="11" fill="#2c3e50" text-anchor="middle">相机</text>

  <text x="352" y="272" font-size="12" font-weight="bold" fill="#34495e">r</text>
  <text x="364" y="272" font-size="11" fill="#5d6d7e">（1.4 ~ 9 m）</text>

  <!-- 极角 φ -->
  <line x1="300" y1="300" x2="300" y2="180" stroke="#7f8c8d" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M300,240 A60,60 0 0 1 346.9,262.6" fill="none" stroke="#8e44ad" stroke-width="1.8"/>
  <text x="314" y="234" font-size="12" font-weight="bold" fill="#8e44ad">φ</text>
  <text x="352" y="284" font-size="10.5" fill="#8e44ad">≤ 1.45 rad</text>

  <!-- 滚轮 / 平移提示 -->
  <path d="M436,238 C 448,262 440,286 424,300" fill="none" stroke="#34495e" stroke-width="1.8" marker-end="url(#aC)"/>
  <text x="424" y="196" font-size="11" fill="#34495e">滚轮：推进 / 拉远</text>
  <path d="M150,392 L 250,392" fill="none" stroke="#34495e" stroke-width="1.8" marker-end="url(#aC)" stroke-dasharray="6 4"/>
  <text x="150" y="384" font-size="11" fill="#34495e">右键拖动：平移（pan）</text>

  <!-- 右侧交互表 -->
  <rect x="540" y="80" width="410" height="32" fill="#eef3f8" stroke="#c8d3dd" stroke-width="1.4"/>
  <text x="552" y="101" font-size="12.5" font-weight="bold" fill="#2c3e50">鼠标动作</text>
  <text x="684" y="101" font-size="12.5" font-weight="bold" fill="#2c3e50">映射 / 效果</text>

  <g stroke="#d5dbdb" stroke-width="1.2">
    <line x1="540" y1="112" x2="950" y2="112"/>
    <line x1="540" y1="146" x2="950" y2="146"/>
    <line x1="540" y1="190" x2="950" y2="190"/>
    <line x1="540" y1="224" x2="950" y2="224"/>
    <line x1="540" y1="268" x2="950" y2="268"/>
    <line x1="540" y1="300" x2="950" y2="300"/>
    <line x1="672" y1="80" x2="672" y2="300"/>
  </g>

  <g font-size="11.5" fill="#2c3e50">
    <text x="552" y="134">左键拖动（空白处）</text>
    <text x="684" y="134">旋转 rotate：θ、φ 随拖动变化</text>

    <text x="552" y="168">滚轮</text>
    <text x="684" y="168">推进 / 拉远 dolly；zoomToCursor = true</text>
    <text x="684" y="184">使镜头朝鼠标指向推进</text>

    <text x="552" y="212">右键拖动</text>
    <text x="684" y="212">平移 pan：target 与相机同步平移</text>

    <text x="552" y="246">左键按住器件本体</text>
    <text x="684" y="246">拖动器件：controls.enabled = false，</text>
    <text x="684" y="262">相机冻结，位移 ≥ 6 px 才起拖</text>

    <text x="552" y="288">单击（位移 &lt; 6 px）</text>
    <text x="684" y="288">仍是点击：端子连线 / 合闸语义不变</text>
  </g>

  <!-- 约束 -->
  <rect x="540" y="315" width="410" height="150" rx="10" fill="#f7f9fb" stroke="#8fa6b8" stroke-width="1.6"/>
  <text x="556" y="339" font-size="12.5" font-weight="bold" fill="#2c5f9e">运动约束与分派规则</text>
  <g font-size="11.5" fill="#3d566e">
    <text x="556" y="362">· 半径 r ∈ [1.4, 9] m，极角 maxPolarAngle = 1.45 rad</text>
    <text x="570" y="380">（≈83°，视线不会钻到桌底）</text>
    <text x="556" y="402">· 阻尼 damping = 0.08：每帧 controls.update() 让惯性渐停，</text>
    <text x="570" y="420">静止后 change 事件不再触发 → 不再置脏渲染</text>
    <text x="556" y="442">· 器件拖动钳制桌沿 ±(tableW/2 − hx − 0.03)，互不重叠；</text>
    <text x="570" y="460">整步被挡时退化为单轴滑墙绕行</text>
  </g>

  <text x="24" y="520" font-size="12" fill="#7f8c8d">两个实测坑：① OrbitControls 的拖动监听挂在 document 层（依赖事件冒泡），视窗内的 pointer 处理器一旦 stopPropagation，</text>
  <text x="24" y="540" font-size="12" fill="#7f8c8d">旋转 / 平移会全部失效、滚轮被拒 —— 所以视窗只阻断 dblclick / wheel / contextmenu。</text>
  <text x="24" y="562" font-size="12" fill="#7f8c8d">② 射线拾取直接使用节点 matrixWorld，而矩阵由渲染循环刷新：每次拾取前 _syncMatrices() 强制 scene + camera updateMatrixWorld(true)，不依赖渲染帧。</text>
</svg>
