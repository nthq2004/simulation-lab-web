<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="aS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="580" fill="#fbfcfe"/>

  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0e6655">图 5 · 电路求解闭环（操作开关 / 滑片 → 重新求解 → 灯泡亮度随之变化）</text>
  <text x="24" y="58" font-size="13" fill="#7f8c8d">求解内核完全沿用平台：CircuitTopology 并查集建节点簇 → MNA 列方程 → 高斯消元 → 器件回读反馈。</text>

  <!-- ① 操作 -->
  <rect x="330" y="84" width="320" height="76" rx="10" fill="#eaf2fd" stroke="#1c56d6" stroke-width="2"/>
  <text x="346" y="110" font-size="13.5" font-weight="bold" fill="#14428f">① 操作改变器件状态</text>
  <text x="346" y="132" font-size="11.5" fill="#2c3e50">点击闸刀 → toggle() 翻转 isOn（带杆臂动画）</text>
  <text x="346" y="150" font-size="11.5" fill="#2c3e50">拖动滑片 → 写入 currentResistance</text>

  <!-- ② 拓扑 -->
  <rect x="660" y="250" width="290" height="136" rx="10" fill="#e8f6f3" stroke="#16a085" stroke-width="2"/>
  <text x="676" y="276" font-size="13.5" font-weight="bold" fill="#0e6655">② 拓扑：并查集建节点簇</text>
  <text x="676" y="300" font-size="11.5" fill="#2c3e50">CircuitTopology 把被连线引用的端口</text>
  <text x="676" y="318" font-size="11.5" fill="#2c3e50">合并成“节点簇”；合闸开关直接</text>
  <text x="676" y="336" font-size="11.5" fill="#2c3e50">union(l, r)（等效零电阻）；</text>
  <text x="676" y="354" font-size="11.5" fill="#2c3e50">电池负极簇自动成为参考地。</text>

  <!-- ③ 求解 -->
  <rect x="330" y="418" width="320" height="94" rx="10" fill="#f9f0fb" stroke="#8e44ad" stroke-width="2"/>
  <text x="346" y="444" font-size="13.5" font-weight="bold" fill="#6c3483">③ 列方程 → 高斯消元</text>
  <text x="346" y="466" font-size="11.5" fill="#2c3e50">DeviceStamps 按类型写入 MNA 导纳矩阵：</text>
  <text x="346" y="484" font-size="11.5" fill="#2c3e50">电池 V/rOn 注入 + 1/rOn；电阻 / 灯泡 1/R；</text>
  <text x="346" y="502" font-size="11.5" fill="#2c3e50">部分主元高斯消元解出各节点电压。</text>

  <!-- ④ 回读反馈 -->
  <rect x="30" y="250" width="290" height="136" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="46" y="276" font-size="13.5" font-weight="bold" fill="#922b21">④ 回读与反馈（闭环）</text>
  <text x="46" y="300" font-size="11.5" fill="#2c3e50">getVoltageBetween('bulb_wire_l',</text>
  <text x="46" y="318" font-size="11.5" fill="#2c3e50">'bulb_wire_r') → RMS 平滑（≈0.5 s）</text>
  <text x="46" y="336" font-size="11.5" fill="#2c3e50">→ 三重发光 → 热阻回写</text>
  <text x="46" y="356" font-size="11.5" font-weight="bold" fill="#c0392b">currentResistance = 9 + 24 × heat</text>

  <!-- 循环箭头 -->
  <g fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#aS)">
    <path d="M650,120 C 722,128 790,172 790,246"/>
    <path d="M800,386 C 796,440 740,465 654,465"/>
    <path d="M330,465 C 256,465 178,450 174,390"/>
    <path d="M175,250 C 180,176 254,122 326,120"/>
  </g>

  <!-- 中央说明 -->
  <rect x="338" y="196" width="304" height="190" rx="12" fill="#ffffff" stroke="#b0bec5" stroke-width="1.4" stroke-dasharray="7 6"/>
  <g text-anchor="middle">
    <text x="490" y="226" font-size="13" font-weight="bold" fill="#2c3e50">20 fps 仿真循环</text>
    <text x="490" y="252" font-size="11.5" fill="#3d566e">每帧 _updatePhysics(1/20 s)</text>
    <text x="490" y="278" font-size="11.5" fill="#3d566e">仅当 conns 中存在 wire 连线才求解</text>
    <text x="490" y="304" font-size="11.5" fill="#3d566e">无连线时器件读数按 0 防护</text>
    <text x="490" y="336" font-size="11" fill="#7f8c8d">灯泡热阻反过来改变电流</text>
    <text x="490" y="354" font-size="11" fill="#7f8c8d">（真实灯泡的正温度系数效应）</text>
  </g>

  <text x="24" y="540" font-size="12" fill="#555">合闸瞬间：拓扑闭合 → 灯泡两端获得接近电池电压的电位差 → 渐亮；分闸后回路断开 → 读数归零 → 渐灭。</text>
  <text x="24" y="562" font-size="12" fill="#7f8c8d">变阻器把“滑片位置 → 阻值”直接写进 currentResistance：滑片一拖，下一帧就按新电导重新列方程，所以灯亮跟着滑片实时变化。</text>
</svg>
